apiVersion: v1
kind: Service
metadata:
  name: pioneer-backend-service
  namespace: pioneer-trio
  labels:
    app: pioneer-backend
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: pioneer-backend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pioneer-backend-ingress
  namespace: pioneer-trio
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - api.pioneertrioservices.com
      secretName: pioneer-backend-tls
  rules:
    - host: api.pioneertrioservices.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pioneer-backend-service
                port:
                  number: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pioneer-backend-hpa
  namespace: pioneer-trio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pioneer-backend-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pioneer-backend-config
  namespace: pioneer-trio
data:
  NODE_ENV: "production"
  PORT: "5000"
  API_PREFIX: "/api/v1"
  CORS_ORIGIN: "https://pioneertrioservices.com,https://www.pioneertrioservices.com"
  STORAGE_PROVIDER: "s3"
  S3_REGION: "ap-southeast-1"
  S3_BUCKET_DOCUMENTS: "pioneer-prod-documents"
  S3_BUCKET_PHOTOS: "pioneer-prod-photos"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: pioneer-backend-secrets
  namespace: pioneer-trio
type: Opaque
stringData:
  DATABASE_URL: "postgresql://pioneer_prod:CHANGE_ME_IN_PROD@postgres-service:5432/pioneer_production?schema=public&connection_limit=50"
  REDIS_URL: "redis://:CHANGE_REDIS_PASS_IN_PROD@redis-service:6379"
  JWT_SECRET: "PRODUCTION_JWT_SECRET_LONG_KEY_HERE_2026"
  ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  S3_ACCESS_KEY_ID: "AWS_ACCESS_KEY_PLACEHOLDER"
  S3_SECRET_ACCESS_KEY: "AWS_SECRET_KEY_PLACEHOLDER"
  SMTP_USER: "leads@pioneertrioservices.com"
  SMTP_PASS: "SMTP_PASS_PLACEHOLDER"
  SENTRY_DSN: "https://sentry_dsn_placeholder@sentry.io/123456"
