apiVersion: apps/v1
kind: Deployment
metadata:
  name: pioneer-backend-deployment
  namespace: pioneer-trio
  labels:
    app: pioneer-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pioneer-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pioneer-backend
    spec:
      containers:
        - name: pioneer-backend
          image: ghcr.io/pioneertrio/pioneer-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: pioneer-backend-config
            - secretRef:
                name: pioneer-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
