services:
  # Main Backend API Service
  - type: web
    name: pioneer-backend
    env: node
    region: ohio
    plan: free
    runtime: node-20
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Environment
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_PREFIX
        value: /api/v1
      
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: pioneer-postgres
          property: connectionString
      
      # Redis Cache
      - key: REDIS_URL
        fromService:
          name: pioneer-redis
          type: pserver
          property: connectionString
      
      # JWT Secrets (Set these in Render Dashboard)
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      
      # AWS S3 (Set in Render Dashboard)
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_REGION
        value: us-east-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_DOCUMENTS
        value: pioneer-documents-prod
      - key: S3_BUCKET_PHOTOS
        value: pioneer-photos-prod
      
      # Email Service (Gmail)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      
      # CORS
      - key: CORS_ORIGIN
        value: https://pioneertrioservices.com,https://www.pioneertrioservices.com
      
      # Observability
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: info
      
      # Rate Limiting
      - key: RATE_LIMIT_GLOBAL_MAX
        value: 100
      - key: RATE_LIMIT_AUTH_MAX
        value: 5

# PostgreSQL Database (Free tier)
databases:
  - name: pioneer-postgres
    plan: free
    region: ohio
    ipAllowList: []
  # Redis Cache (Free tier)
  - name: pioneer-redis
    plan: free
    type: pserver
    region: ohio
    ipAllowList: []
