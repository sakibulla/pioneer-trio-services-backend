services:
  - type: web
    name: pioneer-backend
    env: node
    region: ohio
    plan: free
    buildCommand: npm install --include=dev && npm ls @types/node typescript && npx tsc --version && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pioneer-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pioneer-redis
          type: pserver
          property: connectionString

databases:
  - name: pioneer-postgres
    plan: free
    region: ohio
  - name: pioneer-redis
    plan: free
    type: pserver
    region: ohio
