version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: pioneer_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - pioneer_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    container_name: pioneer_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://pioneer_prod:${DB_PASSWORD}@postgres:5432/pioneer_production?schema=public&connection_limit=50
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pioneer_network

  postgres:
    image: postgres:15-alpine
    container_name: pioneer_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: pioneer_production
      POSTGRES_USER: pioneer_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pioneer_prod -d pioneer_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pioneer_network

  redis:
    image: redis:7-alpine
    container_name: pioneer_prod_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pioneer_network

networks:
  pioneer_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
